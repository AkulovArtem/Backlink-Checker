name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - fix/bugs-and-lazy-scroll
      - main
      - master

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install chromium chromium-headless-shell

      - name: Build EXE
        run: python -m PyInstaller BacklinkChecker.spec --clean --noconfirm

      - name: Rename for distribution
        run: copy "dist\Backlink Checker.exe" "dist\BacklinkChecker.exe"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: BacklinkChecker-windows-x64
          path: dist/BacklinkChecker.exe
          if-no-files-found: error
          retention-days: 14
